<!-- Canonical site navigation — single source of truth for every page -->
<a class="skip-link" href="#main">Skip to main content</a>

<nav class="site-nav" id="navbar" aria-label="Primary">
  <div class="nav-container">
    <a href="{{ '/' | relative_url }}" class="nav-logo">Martin Li</a>

    <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
      <i class="fas fa-bars"></i>
    </button>

    <ul class="nav-links" id="navLinks">
      <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Home</a></li>
      <li><a href="{% if page.url == '/' %}#experience{% else %}{{ '/#experience' | relative_url }}{% endif %}">Experience</a></li>
      <li><a href="{% if page.url == '/' %}#projects{% else %}{{ '/#projects' | relative_url }}{% endif %}">Projects</a></li>
      <li><a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog' or page.layout == 'post' %} class="active"{% endif %}>Blog</a></li>
      <li><a href="{{ '/learning.html' | relative_url }}"{% if page.url contains 'learning' %} class="active"{% endif %}>Learning</a></li>
      <li><a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about' %} class="active"{% endif %}>About</a></li>
      <li><a href="{% if page.url == '/' %}#contact{% else %}{{ '/#contact' | relative_url }}{% endif %}">Contact</a></li>
      <li><a href="{{ '/Resume.pdf' | relative_url }}" class="btn-resume" target="_blank" rel="noopener"><i class="fas fa-file-arrow-down" aria-hidden="true"></i> Résumé</a></li>
      <li>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
          <i class="fas fa-moon"></i>
          <i class="fas fa-sun"></i>
        </button>
      </li>
    </ul>
  </div>
</nav>
