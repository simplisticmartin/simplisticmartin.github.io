# Site settings
title: "Martin Li"
tagline: "Software Engineer II @ JPMorgan Chase | Georgia Tech M.S. CS (AI)"
description: >
  Full-stack Software Engineer with 5+ years building enterprise financial microservices in Java,
  Spring, Spring Boot, React, TypeScript, and SQL Server on AWS at JPMorgan Chase.
  Georgia Tech M.S. in Computer Science (Artificial Intelligence) and AWS Certified Cloud Practitioner.

email: simplisticmartin@gmail.com
author: Martin Li
url: "https://simplisticmartin.github.io"
baseurl: ""

# Social links
social:
  github: simplisticmartin
  linkedin: simplisticmartin
  email: simplisticmartin@gmail.com

# Build settings
markdown: kramdown

# Jekyll plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-gist
  - jemoji

# Pagination
paginate: 6
paginate_path: "/blog/page:num/"

# Permalink for blog
permalink: /blog/:year/:month/:day/:title/

# Keep these files in _site even though they're not processed
keep_files:
  - old-version

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # old-version is a static archive; don't let its nested legacy _posts
  # leak into (and collide with) the main site's blog.
  - old-version/_posts
  - old-version/_drafts

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Blog Categories
blog_categories:
  - name: "Career"
    slug: "career"
    description: "Insights from working at JPMorgan Chase and software engineering career advice"
    icon: "💼"
  - name: "AI & Machine Learning"
    slug: "ai"
    description: "AI research, machine learning projects, and lessons from Georgia Tech"
    icon: "🤖"
  - name: "Quant Finance"
    slug: "quant-finance"
    description: "Quantitative finance, algorithmic trading, and financial engineering"
    icon: "📈"
  - name: "Learning"
    slug: "learning"
    description: "Study tips, course reviews, and continuous learning journey"
    icon: "📚"
  - name: "Public Speaking"
    slug: "public-speaking"
    description: "Presentations, technical talks, and professional communication"
    icon: "🎤"
  - name: "YouTube"
    slug: "youtube"
    description: "Video content, tutorials, and tech explanations"
    icon: "🎥"
  - name: "Nonsense"
    slug: "nonsense"
    description: "Random thoughts, fun stuff, and everything else"
    icon: "🎲"

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

# Site logo and images
logo: "/assets/images/favicon.png"
cover: "/assets/images/cA4aKEIPQrerBnp1yGHv_IMG_9534-3-2.jpg"
author_image: "/img/profile-pic.jpg"

# Comments (using giscus - modern alternative to disqus)
comments:
  provider: "giscus"
  giscus:
    repo: "simplisticmartin/simplisticmartin.github.io"
    repo_id: ""
    category: "Comments"
    category_id: ""

# Analytics (update with your GA4 ID)
google_analytics: ""

# SEO
twitter:
  username: 
  card: summary_large_image

# Theme
theme: null
