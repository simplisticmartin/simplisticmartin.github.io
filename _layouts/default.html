<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body>

  {% include navigation.html %}

  <!-- Main Content -->
  <main id="main" tabindex="-1">
    {{ content }}
  </main>

  {% include footer.html %}

  <!-- Back to Top Button -->
  <button class="back-to-top" id="backToTop" aria-label="Back to top">
    <i class="fas fa-arrow-up"></i>
  </button>

  <!-- Scripts -->
  <script src="{{ '/assets/js/modern.js' | relative_url }}"></script>
  {% if page.script %}
  <script src="{{ page.script | relative_url }}" defer></script>
  {% endif %}

</body>
</html>
